<html class="light" lang="en">

<style>
    body {
        font-family: "Inter", sans-serif;
    }
    .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
    /* Video Background Styles */
    .video-bg {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        z-index: -1;
        object-fit: cover;
    }
    /* Content wrapper to stay above video */
    .content-wrapper {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        background-color: rgba(253, 251, 247, 0.4); /* Slight overlay for readability */
        backdrop-filter: blur(8px); /* Optional: blur the background slightly */
    }
</style>
</head>
<body class="text-on-surface selection:bg-primary-container selection:text-white min-h-screen">

<!-- Video Background -->
<video autoplay loop muted playsinline class="video-bg">
    <source src="../docs/background.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
</video>

<!-- Content Wrapper -->
<div class="content-wrapper flex flex-col">
    <!-- TopAppBar -->
    <header class="flex justify-start items-center w-full px-8 py-6 bg-transparent font-['Inter'] antialiased">
        <div class="flex items-center gap-3">
            <img alt="Checkhook Logo" class="w-10 h-10 object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/ADBb0ugkhSMnZOBObANS3LrNoUs3s2wHlYqKee7pv6NM_lNJRKc5iUm2oVIJgBPiN-hdph1oUE_NYwFOtF5ki38vIxtY8vMvM_pR_yCufh4WDNs_Sxs0k8_EFZPNXXNFZ0eSvx0P1Y7TB2Xyxtxv0ga-S_C3o9pYo2wG-KeRSof_kdSA30rJwiJPhN83auyOaCpyuPgeRYhdx3xkyK3EjPRhqjpWWGB4ap0zWkUTFsvZghDxj7mCeXgNWHNVJGijAUoCNMkjMvzWCXp8-ro" />
            <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-slate-50">Checkhook</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-start px-4 pt-16 pb-12">
        <div class="w-full max-w-lg">
            <!-- New Centered Title -->
            <div class="text-center mb-10">
                <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">check your n8n webhook workflows</h2>
            </div>

            <!-- Form Card -->
            <div class="bg-white border border-outline-variant rounded-xl shadow-lg overflow-hidden p-8 mt-4">
                <form id="webhook-form" class="space-y-6">
                    <!-- Webhook URL Input -->
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-on-surface-variant tracking-tight uppercase" for="webhook_url">Webhook URL</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                                <span class="material-symbols-outlined text-lg">link</span>
                            </div>
                            <input class="w-full bg-[#F8FAFC] border border-outline-variant rounded-lg pl-10 pr-4 py-3 text-on-surface focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none" id="webhook_url" name="webhook_url" placeholder="https://your-n8n.com/webhook/..." type="url" required />
                        </div>
                    </div>

                    <!-- Message Input -->
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-on-surface-variant tracking-tight uppercase" for="message">Message</label>
                        <textarea class="w-full bg-[#F8FAFC] border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none resize-none" id="message" name="message" placeholder="Enter your payload message here" rows="4" required></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button id="submit-btn" class="w-full bg-[#2563EB] hover:bg-[#1D4ED8] text-white font-bold py-4 px-6 rounded-lg transition-all active:scale-[0.98] flex justify-center items-center gap-2 shadow-md hover:shadow-lg disabled:opacity-75 disabled:cursor-not-allowed" type="submit">
                        <span id="submit-icon" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
                        <span id="submit-text">Test Webhook</span>
                    </button>

                    <!-- Result Panel -->
                    <div id="result-panel" class="hidden mt-8 p-4 rounded-lg flex items-start gap-3">
                        <div id="result-icon-container" class="mt-0.5">
                            <span id="result-icon" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                        </div>
                        <div class="space-y-1">
                            <p id="result-title" class="font-semibold text-sm leading-tight">Response Received</p>
                            <p id="result-message" class="text-sm">n8n workflow is working with webhook.</p>
                            <div id="result-details" class="text-xs opacity-80 mt-1 hidden" style="white-space: pre-wrap; font-family: monospace;"></div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Footer / Credits -->
            <footer class="flex flex-col items-center justify-center space-y-4 w-full py-12 text-sm font-medium">
                <div class="flex items-center gap-3">
                    <span class="text-slate-500 font-bold mix-blend-multiply">Built by Sagar</span>
                    <div class="w-1 h-1 rounded-full bg-slate-400"></div>
                    <a class="text-slate-500 hover:text-blue-600 transition-colors flex items-center gap-1 group" href="https://www.linkedin.com/in/sagar-singh-a60884359/" target="_blank">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"></path>
                        </svg>
                        <span class="sr-only">LinkedIn</span>
                    </a>
                </div>
            </footer>
        </div>
    </main>
</div>

<script>
    document.getElementById('webhook-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const url = document.getElementById('webhook_url').value;
        const message = document.getElementById('message').value;
        const submitBtn = document.getElementById('submit-btn');
        const submitText = document.getElementById('submit-text');
        const submitIcon = document.getElementById('submit-icon');
        const resultPanel = document.getElementById('result-panel');
        const resultIconContainer = document.getElementById('result-icon-container');
        const resultIcon = document.getElementById('result-icon');
        const resultTitle = document.getElementById('result-title');
        const resultMessage = document.getElementById('result-message');
        const resultDetails = document.getElementById('result-details');
        
        const payload = { message: message };

        // Helper to update result UI
        const showResult = (type, title, msg, details = null) => {
            resultPanel.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-100', 'bg-red-50', 'border-red-100');
            resultIconContainer.classList.remove('text-emerald-600', 'text-red-600');
            resultTitle.classList.remove('text-emerald-900', 'text-red-900');
            resultMessage.classList.remove('text-emerald-700', 'text-red-700');
            resultDetails.classList.remove('text-emerald-700', 'text-red-700');
            
            if (type === 'success') {
                resultPanel.classList.add('bg-emerald-50', 'border', 'border-emerald-100');
                resultIconContainer.classList.add('text-emerald-600');
                resultTitle.classList.add('text-emerald-900');
                resultMessage.classList.add('text-emerald-700');
                resultDetails.classList.add('text-emerald-700');
                resultIcon.textContent = 'check_circle';
            } else {
                resultPanel.classList.add('bg-red-50', 'border', 'border-red-100');
                resultIconContainer.classList.add('text-red-600');
                resultTitle.classList.add('text-red-900');
                resultMessage.classList.add('text-red-700');
                resultDetails.classList.add('text-red-700');
                resultIcon.textContent = 'error';
            }
            
            resultTitle.textContent = title;
            resultMessage.textContent = msg;
            
            if (details) {
                resultDetails.textContent = details;
                resultDetails.classList.remove('hidden');
            } else {
                resultDetails.classList.add('hidden');
            }
        };

        // Loading state
        submitBtn.disabled = true;
        submitText.textContent = 'Sending...';
        submitIcon.textContent = 'hourglass_empty';
        resultPanel.classList.add('hidden');

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const responseText = await response.text();

            if (response.ok) {
                if (responseText && responseText.trim() !== '') {
                    // Scenario 1: HTTP 2xx and response body is NOT empty
                    showResult(
                        'success',
                        'Response Received',
                        'Message received – webhook is working with n8n workflow',
                        responseText.length > 500 ? responseText.substring(0, 500) + '...' : responseText
                    );
                    resetButtonState();
                } else {
                    // Scenario 2: HTTP 2xx but response body IS empty
                    // Start a 10-second timer
                    submitText.textContent = 'Waiting for response...';
                    
                    setTimeout(() => {
                        showResult(
                            'error',
                            'Timeout Error',
                            'n8n workflow and webhook is not responding properly'
                        );
                        resetButtonState();
                    }, 10000);
                }
            } else {
                // Scenario 3: Error status (HTTP 4xx, 5xx)
                showResult(
                    'error',
                    'HTTP Error ' + response.status,
                    'n8n workflow and webhook is not responding properly',
                    response.statusText || responseText
                );
                resetButtonState();
            }

        } catch (error) {
            // Scenario 3: Network error or CORS
            showResult(
                'error',
                'Network Error',
                'n8n workflow and webhook is not responding properly',
                error.message
            );
            resetButtonState();
        }

        function resetButtonState() {
            submitBtn.disabled = false;
            submitText.textContent = 'Test Webhook';
            submitIcon.textContent = 'send';
        }
    });
</script>
</body>
</html>
