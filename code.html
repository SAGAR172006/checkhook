<body class="full-bg text-on-surface selection:bg-primary-container selection:text-white min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-start items-center w-full px-8 py-6 bg-transparent font-['Inter'] antialiased">
<div class="flex items-center gap-3">
<img alt="Checkhook Logo" class="w-10 h-10 object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/ADBb0ugkhSMnZOBObANS3LrNoUs3s2wHlYqKee7pv6NM_lNJRKc5iUm2oVIJgBPiN-hdph1oUE_NYwFOtF5ki38vIxtY8vMvM_pR_yCufh4WDNs_Sxs0k8_EFZPNXXNFZ0eSvx0P1Y7TB2Xyxtxv0ga-S_C3o9pYo2wG-KeRSof_kdSA30rJwiJPhN83auyOaCpyuPgeRYhdx3xkyK3EjPRhqjpWWGB4ap0zWkUTFsvZghDxj7mCeXgNWHNVJGijAUoCNMkjMvzWCXp8-ro"/>
<h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-slate-50">Checkhook</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-start px-4 pt-16 pb-12">
<div class="w-full max-w-lg">
<!-- New Centered Title -->
<div class="text-center mb-10">
<h2 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">check your n8n webhook workflows</h2>
</div>
<!-- Form Card -->
<div class="bg-white border border-outline-variant rounded-xl shadow-sm overflow-hidden p-8 mt-4">
<div class="space-y-6">
<!-- Webhook URL Input -->
<div class="space-y-2">
<label class="text-sm font-semibold text-on-surface-variant tracking-tight uppercase" for="webhook_url">Webhook URL</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-lg">link</span>
</div>
<input class="w-full bg-[#F8FAFC] border border-outline-variant rounded-lg pl-10 pr-4 py-3 text-on-surface focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none" id="webhook_url" name="webhook_url" placeholder="https://your-n8n.com/webhook/..." type="url"/>
</div>
</div>
<!-- Message Input -->
<div class="space-y-2">
<label class="text-sm font-semibold text-on-surface-variant tracking-tight uppercase" for="message">Message</label>
<textarea class="w-full bg-[#F8FAFC] border border-outline-variant rounded-lg px-4 py-3 text-on-surface focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none resize-none" id="message" name="message" placeholder="Enter your payload message here" rows="4"></textarea>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#2563EB] hover:bg-[#1D4ED8] text-white font-bold py-4 px-6 rounded-lg transition-all active:scale-[0.98] flex justify-center items-center gap-2 shadow-md hover:shadow-lg" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
                        Test Webhook
                    </button>
<!-- Result Panel (Success State) -->
<div class="mt-8 p-4 bg-emerald-50 border border-emerald-100 rounded-lg flex items-start gap-3">
<div class="text-emerald-600 mt-0.5">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="space-y-1">
<p class="text-emerald-900 font-semibold text-sm leading-tight">Response Received</p>
<p class="text-emerald-700 text-sm">n8n workflow is working with webhook.</p>
</div>
</div>
</div>
</div>
<!-- Footer / Credits -->
<footer class="flex flex-col items-center justify-center space-y-4 w-full py-12 text-sm font-medium">
<div class="flex items-center gap-3">
<span class="text-slate-500">Built by Sagar</span>
<div class="w-1 h-1 rounded-full bg-slate-300"></div>
<a class="text-slate-500 hover:text-blue-600 transition-colors flex items-center gap-1 group" href="https://linkedin.com" target="_blank">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"></path>
</svg>
<span class="sr-only">LinkedIn</span>
</a>
</div>
</footer>
</div>
